<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trip Fees Form</title>
  <style>
    body { font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; min-height: 100vh; display:flex; align-items:center; justify-content:center; background:#f7f7f7; color:#222; }
    .card { background:#fff; border:1px solid #dbe4e8; border-radius:14px; box-shadow:0 10px 30px rgba(0,0,0,.08); padding:2rem; width:min(92vw, 520px); text-align:center; }
    img { max-width:260px; width:100%; height:auto; }
    h1 { margin:1rem 0 .5rem; text-transform:uppercase; letter-spacing:.08em; font-size:1.4rem; }
    p { margin: 0 0 1.4rem; color:#455a64; }
    .actions { display:flex; gap:.75rem; justify-content:center; flex-wrap:wrap; }
    .btn { text-decoration:none; display:inline-flex; align-items:center; justify-content:center; padding:.8rem 1.2rem; border-radius:.6rem; font-weight:700; border:1px solid transparent; }
    .btn-ai { background:#00796b; color:#fff; }
    .btn-ai:hover { background:#00897b; }
    .btn-manual { background:#fff; color:#006064; border-color:#006064; }
    .btn-manual:hover { background:#e0f2f1; }
  </style>
</head>
<body>
  <main class="card">
    <img src="banner.png" alt="NUCC banner" />
    <h1>Trip Fees Form</h1>
    <p>How would you like to fill in this trip record?</p>
    <div class="actions">
      <a class="btn btn-ai" href="ai.html">AI Form</a>
      <a class="btn btn-manual" href="manual.html">Manual Form</a>
    </div>
  </main>
</body>
</html>
