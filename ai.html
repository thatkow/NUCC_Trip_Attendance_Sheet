<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trip Fees Form - AI Form</title>
  <style>
    body { margin: 0; padding: 1.5rem; background: #f7f7f7; color: #222; font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .wrap { max-width: 820px; margin: 0 auto; }
    .card { background: #fff; border: 1px solid #d6e0e3; border-radius: 12px; padding: 1.2rem; box-shadow: 0 0.5rem 1.25rem rgba(0,0,0,.08); }
    h1 { margin: 0 0 .3rem; text-transform: uppercase; letter-spacing: .08em; font-size: 1.4rem; }
    .muted { color: #546e7a; margin: 0 0 1rem; }
    label { display: block; margin: .85rem 0; font-weight: 600; }
    input, textarea { width: 100%; box-sizing: border-box; margin-top: .35rem; padding: .6rem .7rem; border: 1px solid #b0bec5; border-radius: .5rem; font: inherit; }
    textarea { min-height: 130px; resize: vertical; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }
    .actions { display: flex; flex-wrap: wrap; gap: .65rem; margin-top: .85rem; }
    .btn { padding: .55rem .95rem; border-radius: .5rem; border: 1px solid transparent; font-weight: 700; cursor: pointer; }
    .btn-copy { background: #00796b; color: #fff; }
    .btn-open { background: #fff; color: #006064; border-color: #006064; }
    .btn-load { background: #1565c0; color: #fff; }
    .btn-clear { background: #f5f5f5; border-color: #cfd8dc; }
    .top-links { display:flex; justify-content:space-between; align-items:center; margin-bottom:.8rem; gap:.5rem; }
    .top-links a { color:#006064; text-decoration:none; font-weight:600; }
    @media (max-width: 700px) { .row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="top-links">
      <a href="index.html">← Back to form chooser</a>
      <a href="manual.html">Open manual form</a>
    </div>
    <section class="card">
      <h1>Trip Fees Form</h1>
      <p class="muted">AI Form</p>

      <label>
        Location
        <input type="text" id="ai-location" placeholder="e.g. Tuglow, Yagby" autocomplete="off" />
      </label>

      <div class="row">
        <label>
          Date
          <input type="date" id="ai-date" />
        </label>
        <label>
          Trip Leader
          <input type="text" id="ai-leader" placeholder="Name of the trip leader" autocomplete="off" />
        </label>
      </div>

      <label>
        Return distance (km)
        <input type="number" id="ai-distance" placeholder="e.g. 240" min="0" step="1" />
      </label>

      <label>
        Provide details
        <textarea id="ai-notes" placeholder="Who came? Who drove and how much did they spend on petrol? Who hired horizontal gear/camping gear/SRT kits? Any additional expenses?"></textarea>
      </label>

      <div class="actions">
        <button type="button" class="btn btn-copy" id="ai-copy-prompt-btn">Click to copy prompt</button>
        <button type="button" class="btn btn-open" id="ai-open-chatgpt-btn">Open ChatGPT</button>
      </div>

      <h2>Paste the CSV from ChatGPT</h2>
      <label>
        CSV output
        <textarea id="ai-csv-paste" placeholder="Paste the CSV code block content here..." spellcheck="false"></textarea>
      </label>
      <div class="actions">
        <button type="button" class="btn btn-clear" id="ai-clear-csv-btn">Clear</button>
        <button type="button" class="btn btn-load" id="ai-step6-load">Load &amp; summarise</button>
      </div>
    </section>
  </main>

  <script>
    function cleanCsvText(value) {
      return String(value || "").trim().replace(/^```[^\n]*\n?/m, "").replace(/\n?```\s*$/m, "").trim();
    }

    function buildPrompt() {
      const location = document.getElementById("ai-location")?.value.trim() || "";
      const date = document.getElementById("ai-date")?.value || "";
      const leader = document.getElementById("ai-leader")?.value.trim() || "";
      const distance = document.getElementById("ai-distance")?.value.trim() || "";
      const notes = document.getElementById("ai-notes")?.value.trim() || "";
      const distanceLine = distance ? `Return trip distance: ${distance} km\n` : "";

      return [
        "You are converting rough trip notes into a NUCC Trip Fees CSV.",
        "Return ONLY a CSV in a fenced code block using ```csv.",
        "Do not include any explanation outside the code block.",
        "Include metadata rows for: trip_date, trip_location, trip_leader.",
        "Include member rows with Name and expense columns.",
        "Use true/false for boolean fields.",
        "If a value is unknown, leave it blank.",
        "",
        "Trip notes to convert:",
        `Location: ${location}`,
        `Date: ${date}`,
        `Trip Leader: ${leader}`,
        `${distanceLine}${notes}`.trim()
      ].join("\n");
    }

    async function copyPrompt() {
      const promptText = buildPrompt();
      try {
        await navigator.clipboard.writeText(promptText);
        window.alert("Prompt copied! Now open ChatGPT, paste it, then come back and paste the CSV response.");
      } catch (error) {
        console.error("Could not copy prompt", error);
        window.alert(`Could not copy automatically. Please copy manually:\n\n${promptText}`);
      }
    }

    document.getElementById("ai-copy-prompt-btn")?.addEventListener("click", copyPrompt);

    document.getElementById("ai-open-chatgpt-btn")?.addEventListener("click", () => {
      window.open("https://chatgpt.com/?temporary-chat=true", "_blank");
    });

    document.getElementById("ai-clear-csv-btn")?.addEventListener("click", () => {
      const textarea = document.getElementById("ai-csv-paste");
      if (textarea) {
        textarea.value = "";
        textarea.focus();
      }
    });

    document.getElementById("ai-step6-load")?.addEventListener("click", () => {
      const csvText = cleanCsvText(document.getElementById("ai-csv-paste")?.value || "");
      if (!csvText) {
        window.alert("Please paste the CSV text first.");
        return;
      }

      const payload = {
        csv: csvText,
        trip: {
          location: document.getElementById("ai-location")?.value.trim() || "",
          date: document.getElementById("ai-date")?.value || "",
          leader: document.getElementById("ai-leader")?.value.trim() || ""
        },
        distance: document.getElementById("ai-distance")?.value.trim() || "",
        createdAt: new Date().toISOString()
      };

      window.localStorage.setItem("nucc-ai-transfer", JSON.stringify(payload));
      window.location.href = "manual.html?from=ai";
    });
  </script>
</body>
</html>
