<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paste ChatGPT CSV</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f4f6f8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
      color: #222;
    }
    .card {
      background: #fff;
      border-radius: 0.75rem;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
      padding: 2rem;
      width: 100%;
      max-width: 640px;
    }
    h1 {
      font-size: 1.3rem;
      margin-bottom: 0.5rem;
      color: #1a1a2e;
    }
    p.hint {
      font-size: 0.9rem;
      color: #555;
      margin-bottom: 1.25rem;
      line-height: 1.5;
    }
    textarea {
      width: 100%;
      height: 260px;
      border: 1px solid #ccc;
      border-radius: 0.4rem;
      padding: 0.75rem;
      font-family: "Courier New", monospace;
      font-size: 0.85rem;
      resize: vertical;
    }
    textarea:focus { outline: none; border-color: #4a90e2; }
    .btn-row {
      display: flex;
      gap: 0.75rem;
      margin-top: 1rem;
      justify-content: flex-end;
    }
    button {
      padding: 0.55rem 1.2rem;
      border: none;
      border-radius: 0.4rem;
      font-size: 0.95rem;
      cursor: pointer;
      font-weight: 600;
    }
    #clear-btn {
      background: #eee;
      color: #444;
    }
    #clear-btn:hover { background: #ddd; }
    #submit-btn {
      background: #2e7d32;
      color: #fff;
    }
    #submit-btn:hover { background: #1b5e20; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Paste ChatGPT CSV</h1>
    <p class="hint">
      Copy the CSV output from ChatGPT and paste it below, then click <strong>Load into summary</strong>.
    </p>
    <textarea id="csv-input" placeholder="Paste CSV here…"></textarea>
    <div class="btn-row">
      <button type="button" id="clear-btn">Clear</button>
      <button type="button" id="submit-btn">Load into summary</button>
    </div>
  </div>

  <script>
    // If opened with ?goto=1, redirect to ChatGPT (and strip the param so Back works cleanly)
    (function() {
      const params = new URLSearchParams(window.location.search);
      if (params.has('goto')) {
        history.replaceState(null, '', window.location.pathname);
        window.location.href = 'https://chatgpt.com/?temporary-chat=true';
      }
    })();

    document.getElementById('clear-btn').addEventListener('click', function() {
      document.getElementById('csv-input').value = '';
      document.getElementById('csv-input').focus();
    });

    document.getElementById('submit-btn').addEventListener('click', function() {
      const raw = document.getElementById('csv-input').value.trim();
      if (!raw) {
        alert('Please paste the CSV before loading.');
        return;
      }
      // Strip markdown code fences if present
      const cleaned = raw.replace(/^```[^\n]*\n?/m, '').replace(/\n?```\s*$/m, '').trim();
      sessionStorage.setItem('nucc-paste-csv', cleaned);
      window.location.href = 'index.html?auto-csv=1';
    });
  </script>
</body>
</html>
